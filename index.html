<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14202b">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="점소 지도">
<title>곤지암 점소 지도</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#14202b;--ink2:#4a5866;--mute:#7a8794;--line:#d8dee4;--acc:#b07a00;--ok:#2f6fb5;--no:#d23b3b;--up:#d23b3b;--down:#1f8a4d;--sh:0 6px 24px rgba(10,20,30,.18)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#17222d;--ink:#e8edf2;--ink2:#a9b6c3;--mute:#7d8a97;--line:#2a3745;--acc:#ffc52e;--ok:#5aa2ee;--no:#ff7676;--up:#ff7676;--down:#4cd08a;--sh:0 6px 24px rgba(0,0,0,.5)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
#map{position:fixed;inset:0}
.top{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(8px + env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:6px;pointer-events:none}
.top>*{pointer-events:auto}
.row1{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px;font:inherit;font-size:14px;box-shadow:var(--sh)}
.live{flex:0 0 auto;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px 0 10px;font:inherit;font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px;box-shadow:var(--sh);cursor:pointer}
.live i{width:34px;height:20px;border-radius:99px;background:color-mix(in srgb,var(--ink) 20%,transparent);position:relative;transition:.2s}
.live i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:.2s}
.live.on{border-color:var(--acc)}
.live.on i{background:var(--acc)}.live.on i::after{transform:translateX(14px)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:30px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink2);padding:0 12px;font:inherit;font-size:12.5px;font-weight:700;box-shadow:0 2px 8px rgba(10,20,30,.12);cursor:pointer}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.hint{align-self:flex-start;background:var(--card);border:1px solid var(--acc);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:700;box-shadow:var(--sh)}
.dot{position:relative;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);cursor:pointer}
.dot.grp::before{content:attr(data-n);position:absolute;right:-7px;top:-8px;min-width:13px;height:13px;border-radius:7px;background:#14202b;color:#fff;font-size:9px;font-weight:900;line-height:13px;text-align:center;padding:0 2px}
.dot.ok{background:#2f6fb5}.dot.no{background:#d23b3b}
.dot.sel{width:20px;height:20px;box-shadow:0 0 0 4px rgba(255,197,46,.75),0 1px 4px rgba(0,0,0,.5)}
.dot b{position:absolute;left:15px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:12px;font-weight:900;color:#14202b;letter-spacing:-.02em;text-shadow:-1.5px 0 #fff,1.5px 0 #fff,0 -1.5px #fff,0 1.5px #fff,-1px -1px #fff,1px 1px #fff,-1px 1px #fff,1px -1px #fff;display:none;pointer-events:auto}
body.lbl .dot b,.dot.sel b{display:block}
body.lbls .dot b{font-size:10.5px}
body.lblx .dot b{font-size:9.5px;font-weight:800}
.nb{margin:12px 0 0}
.nb h3{font-size:13px;margin:0 0 4px;color:var(--ink2)}
.nb .r{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.nb .n{font-weight:900;font-size:14px;color:var(--ok)}
.nb .m{font-size:12px;color:var(--mute);grid-column:1}
.nb .k{grid-row:1/3;grid-column:2;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;font-size:13.5px}
.nb .k small{display:block;font-size:11.5px;color:var(--mute);font-weight:700}
.dot.sel b{font-size:13px}
.pk{display:flex;flex-direction:column;gap:6px;margin:4px 0 4px}
.pk button{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14.5px;font-weight:800;text-align:left;padding:0 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.pk button span{font-size:12px;color:var(--mute);font-weight:700}
.hub{width:26px;height:26px;border-radius:50%;background:#14202b;border:3px solid #ffc52e;color:#ffc52e;font-weight:900;font-size:13px;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.28);padding:10px 16px calc(16px + env(safe-area-inset-bottom));max-height:72vh;overflow:auto;transform:translateY(105%);transition:transform .25s ease}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.sheet h2{margin:0 0 2px;font-size:19px;font-weight:900}
.sheet .sub{font-size:12.5px;color:var(--mute);margin:0 0 8px}
.x{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink2);font-size:16px;cursor:pointer}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.tag{font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--ink2)}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.no{color:var(--no);border-color:var(--no)}
.addr{font-size:13px;color:var(--ink2);margin:0 0 10px;line-height:1.45}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;color:var(--mute);font-weight:700;border-top:0}
td.l{font-weight:800;white-space:nowrap}
.v{font-weight:800;font-variant-numeric:tabular-nums}
.d{display:block;font-size:11.5px;font-weight:800}
.d.up{color:var(--up)}.d.dn{color:var(--down)}
.mu{color:var(--mute);font-weight:600}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--card);border-color:var(--ink)}
.note{font-size:11.5px;color:var(--mute);margin:10px 0 0;line-height:1.5}
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.gate .box{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 22px;box-shadow:var(--sh);text-align:center}
.gate h1{font-size:20px;margin:0 0 4px;font-weight:900}
.gate p{font-size:13px;color:var(--mute);margin:0 0 16px}
.gate input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:20px;text-align:center;letter-spacing:.3em}
.gate button{width:100%;height:48px;margin-top:10px;border-radius:12px;border:0;background:var(--ink);color:var(--card);font:inherit;font-size:15px;font-weight:900;cursor:pointer}
.gate .err{min-height:18px;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--no)}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;max-width:300px;font-size:13px;line-height:1.5;box-shadow:var(--sh);display:none;text-align:center}
</style></head>
<body>
<div id="map"></div>
<div class="top" id="top" hidden>
  <div class="row1"><input class="search" id="q" type="search" placeholder="점소·노선·간선사 검색" autocomplete="off"><button class="live" id="live" type="button"><span>실시간 교통</span><i></i></button></div>
  <div class="chips" id="chips"></div>
  <div class="hint" id="hint" hidden>점소를 누르면 지금 교통 기준 소요시간이 떠요</div>
</div>
<div class="sheet" id="sheet"><div class="grab"></div><button class="x" id="x" type="button" aria-label="닫기">✕</button><div id="sb"></div></div>
<div class="toast" id="toast"></div>
<div class="gate" id="gate"><form class="box" id="gf"><h1>곤지암 점소 지도</h1><p>팀 비밀번호를 넣어 주세요</p><input id="pw" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••••"><button type="submit">열기</button><div class="err" id="ge"></div></form></div>
<script>
const JSKEY='73b3a31a7a224855459473a53318c6e9';
const FN='https://enkhkggtnelgrsicmrlm.supabase.co/functions/v1/route';
const HUB={lat:37.415327,lon:127.313908};
const REST=20,SUBWAIT=20,SPEED=60;
const $=id=>document.getElementById(id);
const hm=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?h+'시간 '+String(r).padStart(2,'0')+'분':r+'분'};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let PW='',ST=[],map=null,items=[],cur=null,liveOn=false,traffic=false,filt='전체',cache={};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function toast(t,ms){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);if(ms)toast.t=setTimeout(()=>e.style.display='none',ms)}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){
  const r=await fetch('stores.enc.json',{cache:'no-cache'});if(!r.ok)throw new Error('data');
  const j=await r.json();
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(j.s),iterations:j.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(j.i)},k,b64(j.d));
  return JSON.parse(new TextDecoder().decode(pt));
}
function loadSdk(){return new Promise((res,rej)=>{
  if(window.kakao&&kakao.maps&&kakao.maps.Map){res();return}
  const s=document.createElement('script');s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+JSKEY+'&autoload=false';
  s.onload=()=>{try{kakao.maps.load(res)}catch(e){rej(e)}};s.onerror=()=>rej(new Error('sdk'));document.head.appendChild(s);
  setTimeout(()=>rej(new Error('timeout')),15000);
})}
async function unlock(pw,auto){
  const msg=$('ge');msg.textContent=auto?'':'확인 중…';
  try{ST=await decrypt(pw)}catch(e){
    store.del('gj_map_pw');
    msg.textContent=(e&&e.message==='data')?'자료 파일을 못 읽었어요. 잠시 뒤 다시 열어 주세요':'비밀번호가 달라요';
    $('gate').style.display='flex';return false}
  PW=pw;store.set('gj_map_pw',pw);
  try{await loadSdk()}catch(e){
    $('gate').style.display='none';
    toast('카카오 지도를 불러오지 못했어요.\n인터넷을 확인하고 새로고침해 주세요.');return true}
  $('gate').style.display='none';$('top').hidden=false;init();return true;
}
$('gf').addEventListener('submit',e=>{e.preventDefault();const v=$('pw').value.trim();if(v)unlock(v,false)});
function init(){
  ST.forEach(p=>BYN[p[4]]=p);
  map=new kakao.maps.Map($('map'),{center:new kakao.maps.LatLng(36.9,127.7),level:12});
  const hubEl=document.createElement('div');hubEl.className='hub';hubEl.textContent='H';hubEl.title='곤지암 Hub';
  new kakao.maps.CustomOverlay({map,position:new kakao.maps.LatLng(HUB.lat,HUB.lon),content:hubEl,yAnchor:.5,xAnchor:.5,zIndex:5});
  const gm={};
  ST.forEach(p=>{const k=p[10].toFixed(4)+','+p[11].toFixed(4);(gm[k]=gm[k]||[]).push(p)});
  Object.values(gm).forEach(ps=>{
    const el=document.createElement('div');
    const g={ps,el,on:null,vis:ps};
    el.addEventListener('click',ev=>{ev.stopPropagation();g.vis.length>1?pickGroup(g):pick(g.vis[0])});
    g.ov=new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(ps[0][10],ps[0][11]),content:el,yAnchor:.5,xAnchor:.5,zIndex:3});
    items.push(g);
  });
  const b=new kakao.maps.LatLngBounds();ST.forEach(p=>{if(p[12]<260)b.extend(new kakao.maps.LatLng(p[10],p[11]))});map.setBounds(b);
  kakao.maps.event.addListener(map,'zoom_changed',lbl);kakao.maps.event.addListener(map,'click',closeSheet);lbl();
  const fs=['전체','1-1','1-2','2-1','2-2','3-1','3-2','4-1','4-2','셔틀','직출고','TR불가'];
  $('chips').innerHTML=fs.map(f=>'<button class="chip'+(f===filt?' on':'')+'" type="button" data-f="'+f+'">'+(/^\d/.test(f)?f+'반':f)+'</button>').join('');
  $('chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;filt=c.dataset.f;[...$('chips').children].forEach(x=>x.classList.toggle('on',x===c));apply(true)});
  $('q').addEventListener('input',()=>apply(false));
  $('live').addEventListener('click',toggleLive);
  apply(false);
}
function lbl(){const l=map.getLevel();document.body.classList.add('lbl');document.body.classList.toggle('lbls',l>=10);document.body.classList.toggle('lblx',l>=12)}
const short=p=>p[4].replace(/(Sub|Hub|센터)$/,'');
function paint(g){const v=g.vis;g.el.className='dot '+(v.some(p=>p[6])?'ok':'no')+(v.length>1?' grp':'')+(cur&&v.includes(cur)?' sel':'');g.el.dataset.n=v.length;g.el.innerHTML='<b>'+esc(v.map(short).join('·'))+'</b>'}
function match(p,q){
  if(filt==='TR불가'&&p[6])return false;
  if(filt==='셔틀'&&p[3]!=='셔틀')return false;
  if(filt==='직출고'&&p[3]!=='직출고')return false;
  if(/^\d/.test(filt)&&!(p[0]===filt||p[0].split('/').includes(filt)))return false;
  if(q&&![p[2],p[4],p[5],p[7],p[8],p[9],p[1]].join(' ').toLowerCase().includes(q))return false;
  return true;
}
function apply(fit){
  const q=$('q').value.trim().toLowerCase();const vis=[];
  items.forEach(g=>{g.vis=g.ps.filter(p=>match(p,q));const ok=g.vis.length>0;if(ok!==g.on){g.ov.setMap(ok?map:null);g.on=ok}if(ok){paint(g);vis.push(...g.vis)}});
  if(vis.length&&(fit||q)){const b=new kakao.maps.LatLngBounds();vis.forEach(p=>b.extend(new kakao.maps.LatLng(p[10],p[11])));b.extend(new kakao.maps.LatLng(HUB.lat,HUB.lon));map.setBounds(b)}
  if(q&&vis.length===1)pick(vis[0]);
}
function toggleLive(){
  liveOn=!liveOn;$('live').classList.toggle('on',liveOn);$('hint').hidden=!(liveOn&&!cur);
  if(liveOn&&!traffic){map.addOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC);traffic=true}
  if(!liveOn&&traffic){map.removeOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC);traffic=false}
  if(cur)render(cur);
  if(liveOn&&cur)fetchLive(cur,false);
}
function pick(p){
  const old=cur;cur=p;items.forEach(g=>{if(g.ps.includes(p)||(old&&g.ps.includes(old)))paint(g)});
  $('hint').hidden=true;render(p);$('sheet').classList.add('open');
  map.panTo(new kakao.maps.LatLng(p[10]-(map.getLevel()>8?0:0),p[11]));
  if(liveOn)fetchLive(p,false);
}
let BYN={};
function nearHtml(p){
  const nb=p[20]||[];if(!nb.length)return '';
  return '<div class="nb"><h3>가까운 점소</h3>'+nb.map(([n,km,mn])=>{const q=BYN[n];if(!q)return '';
    return '<div class="r" data-n="'+esc(n)+'"><span class="n">'+esc(n)+'</span><span class="m">'+esc(q[0])+(q[3]==='상차 노선'?'반':'')+' · '+esc(q[1]||'-')+' · '+esc(q[2])+' · '+esc(q[7])+' · TR '+(q[6]?'가능':'불가')+'</span><span class="k">'+(km===0?'같은 건물':km.toFixed(1)+'km<small>'+hm(mn)+'</small>')+'</span></div>'}).join('')+
   '<p class="note" style="margin-top:4px">점소끼리 = 카카오내비 도로거리 · 시간은 60km/h 주행만(휴식 없음)</p></div>';
}
function closeSheet(){$('sheet').classList.remove('open');const old=cur;cur=null;if(old)items.forEach(g=>{if(g.ps.includes(old))paint(g)});if(liveOn)$('hint').hidden=false}
function pickGroup(g){
  $('hint').hidden=true;
  $('sb').innerHTML='<h2>같은 건물 '+g.vis.length+'곳</h2><p class="sub">'+esc(g.vis[0][9])+'</p><div class="pk">'+g.vis.map((p,i)=>'<button type="button" data-i="'+i+'">'+esc(p[4])+'<span>'+esc(p[0])+(p[3]==='상차 노선'?'반':'')+' · '+esc(p[1]||'')+' · TR '+(p[6]?'가능':'불가')+'</span></button>').join('')+'</div>';
  $('sb').querySelectorAll('.pk button').forEach(b=>b.addEventListener('click',()=>pick(g.vis[+b.dataset.i])));
  $('sheet').classList.add('open');
}
$('x').addEventListener('click',closeSheet);
function delta(live,base){const d=Math.round(live-base);if(Math.abs(d)<1)return '<span class="d mu">기준과 같음</span>';return '<span class="d '+(d>0?'up':'dn')+'">기준보다 '+(d>0?'+':'−')+hm(Math.abs(d))+'</span>'}
function render(p){
  const L=cache[p[5]],hubSelf=p[12]===0;
  const live=liveOn?(L&&L.ready?L:null):null;
  let lg='',lb='',lr='',lt='';
  if(liveOn){
    if(hubSelf){lg=lb=lr=lt='<span class="mu">해당 없음</span>'}
    else if(L&&L.loading){lg=lb=lr=lt='<span class="mu">받는 중…</span>'}
    else if(L&&L.err){lg=lb=lr=lt='<span class="mu">'+esc(L.err)+'</span>'}
    else if(live){
      lg='<span class="v">'+hm(live.go)+'</span>'+delta(live.go,p[14]);
      lb='<span class="v">'+hm(live.back)+'</span>'+delta(live.back,p[15]);
      lr='<span class="v">'+hm(live.rt)+'</span>'+delta(live.rt,p[16]);
      lt='<span class="v">'+hm(live.turn)+'</span>'+delta(live.turn,p[17]);
    }else{lg=lb=lr=lt='<span class="mu">—</span>'}
  }
  const col=liveOn?'<th>지금 교통</th>':'';
  const c=h=>liveOn?'<td>'+h+'</td>':'';
  $('sb').innerHTML=
   '<h2>'+esc(p[4])+'</h2><p class="sub">'+esc(p[0])+(p[3]==='상차 노선'?'반':'')+' · '+esc(p[1]||'-')+' · '+esc(p[2])+' · '+esc(p[5])+'</p>'+
   '<div class="tags"><span class="tag '+(p[6]?'ok':'no')+'">TR '+(p[6]?'가능':'불가')+'</span><span class="tag">'+esc(p[7])+'</span><span class="tag">'+esc(p[8])+'</span>'+(p[18]!=='정확'?'<span class="tag no">위치 대략</span>':'')+'</div>'+
   '<p class="addr">'+esc(p[9])+'</p>'+
   '<table><tr><th></th><th>기준 (60km/h)</th>'+col+'</tr>'+
   '<tr><td class="l">가는길</td><td><span class="v">'+hm(p[14])+'</span><span class="d mu">'+p[12].toFixed(1)+'km</span></td>'+c(lg)+'</tr>'+
   '<tr><td class="l">오는길</td><td><span class="v">'+hm(p[15])+'</span><span class="d mu">'+p[13].toFixed(1)+'km</span></td>'+c(lb)+'</tr>'+
   '<tr><td class="l">왕복</td><td><span class="v">'+hm(p[16])+'</span></td>'+c(lr)+'</tr>'+
   '<tr><td class="l">다회전<span class="d mu">서브지연 +20분</span></td><td><span class="v">'+hm(p[17])+'</span></td>'+c(lt)+'</tr></table>'+
   nearHtml(p)+
   '<div class="btns"><a class="btn" target="_blank" rel="noopener" href="https://map.kakao.com/link/to/'+encodeURIComponent(p[4])+','+p[10]+','+p[11]+'">카카오맵 길찾기</a>'+(liveOn&&!hubSelf?'<button class="btn pri" id="rf" type="button">지금 다시 받기</button>':'')+'</div>'+
   '<p class="note">기준 = 화물차 평균 60km/h + 이동 중 휴식 20분 (밤 1시 출발 기준 거리). 지금 교통 = 카카오내비 현재 교통 반영 시간과 60km/h 시간 중 더 오래 걸리는 쪽 + 휴식 20분.'+(liveOn&&live?' · '+new Date(live.at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' 기준':'')+'</p>';
  const rf=$('rf');if(rf)rf.addEventListener('click',()=>fetchLive(p,true));
  $('sb').querySelectorAll('.nb .r').forEach(r=>r.addEventListener('click',()=>{const q=BYN[r.dataset.n];if(q){map.panTo(new kakao.maps.LatLng(q[10],q[11]));pick(q)}}));
}
async function fetchLive(p,force){
  if(p[12]===0)return;
  const k=p[5],c=cache[k];
  if(!force&&c&&c.ready&&Date.now()-c.t<180000){render(p);return}
  if(c&&c.loading)return;
  cache[k]={loading:true};render(p);
  try{
    const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pw:PW,lat:p[10],lon:p[11]})});
    if(r.status===401){cache[k]={err:'비밀번호가 바뀌었어요. 새로고침 후 다시 넣어 주세요'};store.del('gj_map_pw');render(p);return}
    const j=await r.json();
    if(!j.go||!j.go.ok||!j.back||!j.back.ok){cache[k]={err:'길찾기 실패: '+((j.go&&j.go.msg)||(j.back&&j.back.msg)||'')};render(p);return}
    const t=(leg)=>Math.max(leg.trafficMin,leg.km*60/SPEED)+REST;
    const go=t(j.go),back=t(j.back);
    cache[k]={ready:true,t:Date.now(),at:j.at,go,back,rt:go+back,turn:go+back+SUBWAIT};
  }catch(e){cache[k]={err:'연결 실패 · 인터넷을 확인해 주세요'}}
  if(cur===p)render(p);
}
const saved=store.get('gj_map_pw');if(saved)unlock(saved,true);else $('pw').focus();
</script>
